name: Planning artifact validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  planning-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate planning contract JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("contracts").glob("*.json"))
          if not files:
              raise SystemExit("No planning contract JSON files found.")
          for path in files:
              json.loads(path.read_text())
          print(f"Validated {len(files)} planning contract JSON files.")
          print("Adapter implementation, test, and structural gates are not run or satisfied.")
          PY
