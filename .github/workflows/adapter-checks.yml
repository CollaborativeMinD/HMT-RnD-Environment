name: Adapter and planning checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - run: uv sync --frozen --group dev
      - run: uv run --frozen --group dev ruff check src tests scripts
      - run: uv run --frozen --group dev python -m pytest -q
      - run: PYTHONPATH=src uv run --frozen --group dev python scripts/check_structure.py
