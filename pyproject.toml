[project]
name = "hmt-rnd-environment"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.12,<3"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff", "pyrefly", "coverage"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
